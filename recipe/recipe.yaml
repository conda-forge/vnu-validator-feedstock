# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.6.24"
  openjdk_min: "11"
  # some weird memory stack overflow issues on 11 which
  # see https://github.com/validator/validator/issues/2073
  openjdk_check_min: "17"

package:
  name: vnu-validator
  version: ${{ version }}

source:
  # building from source is... untenable due to sh/py/ant/java/git sandwich
  - url: https://registry.npmjs.org/vnu-jar/-/vnu-jar-${{ version }}.tgz
    sha256: c5cac3ea079fd1802d104d89aa7852fef70da4e88f74e03d28375e267aa50532
  # this is _not_ distributed on npm
  - url: https://raw.githubusercontent.com/validator/validator/${{ version }}/CREDITS
    sha256: b7f78e603da0e9aa19adb63a3c12af5c8c16e40c43ac115a017cc7ed2517e9fb
    file_name: CREDITS

build:
  number: 0
  noarch: generic
  script:
    file: build-vnu-validator

requirements:
  run:
    - __${{ noarch_platform }}
    - openjdk >=${{ openjdk_min }}

tests:
  - requirements:
      run:
        - python >=3.11
        - pytest-html
        - psutil
        - openjdk ${{ openjdk_check_min }}.*
    script:
      file: run_test.py

about:
  license: MIT
  license_file:
    - LICENSE
    - CREDITS
  summary: Helps you catch problems in your HTML/CSS/SVG
  homepage: https://validator.github.io/validator
  repository: https://github.com/validator/validator

extra:
  recipe-maintainers:
    - bollwyvl
